[program:bayesian]
command=java -jar /usr/bin/bayesian.jar --port 6380 --model /var/www/bayesian_model/model --filters all --save-interval 600 --label-chain true --mml true --am-enabled false --archive /var/www/bayesian_model/archive.csv
autostart=true
autorestart=true
priority=5
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
