[program:bayesian]
command=/usr/local/bin/start_bayesian.sh --port 6380 --model /var/www/bayesian_model/model --save-interval 600 --model-type logistic --placeholders true --stop-words false --dedup true --target-fpr 0.02 --am-enabled false --archive /var/www/bayesian_model/archive.csv --datalog /var/www/bayesian_model/datalog.csv
autostart=true
autorestart=true
priority=5
stopsignal=TERM
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
