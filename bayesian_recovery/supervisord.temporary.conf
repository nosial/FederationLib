[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord-temporary.log
pidfile=/var/run/supervisord-temporary.pid

[unix_http_server]
file=/var/run/supervisord-temporary.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisord-temporary.sock

[include]
files=/etc/supervisor/bayesian.conf
