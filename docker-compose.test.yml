#
#   Test environment override, builds the app from Dockerfile.test which contains the TestPlugin (tests/TestPlugin)
#   and enables it. The production Dockerfile and image never contain the TestPlugin.
#
#   Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#      or: make test-env
#
services:
  app:
    image: federationlib-test
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      # Installed by docker-entrypoint.sh before `federationlib init`
      - REQUIRE_PLUGINS=/opt/federationlib/plugins/net.nosial.test_plugin.ncc
      # The plugins FederationLib loads
      - FEDERATION_PLUGINS=net.nosial.test_plugin
      # The TestPlugin's own configuration (see tests/TestPlugin/src/TestPlugin/Configuration.php)
      - TEST_PLUGIN_GREETING=Hello from the test environment
